<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Focus Alarm</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <h1>Focus Alarm</h1>
  </header>

  <!-- Master switch. Always visible. Turning it off hides everything in #main-content. -->
  <button id="power-btn" class="power" type="button" role="switch" aria-checked="true">
    <span class="power-label">
      <span id="power-title" class="power-title">Alarm is ON</span>
      <span id="power-sub" class="power-sub">Tap to turn off</span>
    </span>
    <span class="switch" aria-hidden="true"><span class="knob"></span></span>
  </button>

  <div id="off-panel" class="off-panel" hidden>
    <p><strong>Tracking is paused.</strong> Nothing is being timed and no alarm can fire.</p>
    <p class="muted">Turn the alarm on to see your timer.</p>
  </div>

  <main id="main-content">
    <section class="card summary">
      <p id="status-text" class="status">Loading...</p>
      <p id="stats-text" class="stats"></p>
    </section>

    <section id="setup-card" class="card notice" hidden>
      <h2 id="setup-title">Finish setup</h2>
      <p id="setup-text" class="hint"></p>
      <button id="setup-btn" class="btn primary" type="button">Open setup</button>
    </section>

    <section class="card">
      <h2>Take a break</h2>
      <div class="row">
        <label class="sr-only" for="focus-duration">Break length</label>
        <select id="focus-duration">
          <option value="15">15 min</option>
          <option value="25" selected>25 min</option>
          <option value="45">45 min</option>
          <option value="60">60 min</option>
        </select>
        <button id="start-focus-btn" class="btn primary" type="button">Start break</button>
      </div>
    </section>

    <p class="foot"><a href="#" id="setup-link">Settings</a></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
